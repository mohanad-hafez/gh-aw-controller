name: CLI performance
on:
  push:
    branches: [replacement-cli-performance-01]
    paths: [.github/cli-performance-ready]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-performance
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'mohanad-hafez/gh-aw-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheTechOddBug/gh-aw
          ref: 856e7fa3ca4f1597f9adbd519eec415ce92320e2
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run benchmarks
        run: |
          make bench-performance
          git rev-parse HEAD > benchmark-source-commit
          go version > benchmark-toolchain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cli-benchmarks
          path: |
            bench_performance.txt
            benchmark-source-commit
            benchmark-toolchain
          retention-days: 7
  report:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      discussions: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-benchmarks
          path: /tmp/performance-input
      - name: Check measurement rules
        run: node --test scripts/performance_metrics.test.mjs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {runPerformanceReport}=await import(process.env.GITHUB_WORKSPACE+'/scripts/performance_report.mjs');
            await runPerformanceReport({github,context});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cli-performance
          path: |
            performance-result.json
            /tmp/gh-aw/agent/benchmarks/current_metrics.json
            /tmp/gh-aw/agent/benchmarks/analysis.json
            /tmp/gh-aw/repo-memory/default/benchmark_history.jsonl
          retention-days: 7
