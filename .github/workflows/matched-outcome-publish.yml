name: Publish verified outcome reports
on:
  push:
    branches: [matched-outcome-publish-01]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [outcome]
        arm: [agent, script]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reminder-${{ matrix.task }}-${{ matrix.arm }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: 42691685373
      - name: Publish the matched reminder
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          TASK: ${{ matrix.task }}
          ARM: ${{ matrix.arm }}
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const {createHash}=require('node:crypto');
            const cfg=require('./.github/matched/verified-outcome.json');
            const file=process.env.ARM==='agent'?'tools.jsonl':'result.json';
            if(createHash('sha256').update(fs.readFileSync('evidence/'+file)).digest('hex')!==cfg.inputs[process.env.ARM]) throw Error('Artifact changed');
            const r=cfg.report;
            const title = 'Test outcome report ' + context.runId + ' ' + process.env.ARM + ' — ' + r.title;
            const response = await github.rest.issues.create({...context.repo,title,body:r.body,labels:r.labels});
            fs.writeFileSync('publication.json',JSON.stringify({number:response.data.number,url:response.data.html_url}));
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ matrix.task }}-${{ matrix.arm }}
          path: publication.json
          retention-days: 14
